; Dos módulos idénticos (A y B): el MISMO programa se carga en los dos ESP32.
; IMPORTANTE: hace falta el ESP32 "clásico" (WROOM-32). El Bluetooth clásico (SPP) NO existe en S2/S3/C3.

[platformio]
default_envs = modulo_a

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

[env:modulo_a]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.embed_txtfiles = web/index.html
; El paquete framework-arduinoespressif32 instalado no trae variants/: se usa la copia local (ver variants/esp32/pins_arduino.h).
board_build.variants_dir = variants
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -Iinclude
    -DDEVICE_NAME=\"SONAR-A\"
    -DWIFI_SSID_MAINT=\"DUELO-A-MANT\"

[env:modulo_b]
extends = env:modulo_a
build_flags =
    ${env.build_flags}
    -Iinclude
    -DDEVICE_NAME=\"SONAR-B\"
    -DWIFI_SSID_MAINT=\"DUELO-B-MANT\"

; Pruebas en el PC (solo lib/core). Requiere un compilador de C++ en Windows (p. ej. MinGW).
[env:native]
platform = native
test_framework = unity
; -Iinclude: lib/core incluye "config.h" (include/), y las bibliotecas no ven include/ por sí solas.
build_flags =
    ${env.build_flags}
    -DNATIVE_TEST
    -Iinclude
lib_ignore = hal_esp32
